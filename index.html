<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glitch Academy - Terminal Access</title>
  <style>
    body {
      background-color: #0d1117;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .terminal {
      border: 2px solid #00ff66;
      border-radius: 8px;
      padding: 20px;
      width: 80%;
      max-width: 600px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
      background-color: #161b22;
    }
    input {
      background: transparent;
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 8px;
      width: 70%;
      font-family: inherit;
    }
    button {
      background: #00ff66;
      color: #0d1117;
      border: none;
      padding: 8px 15px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover {
      background: #00cc52;
    }
    .status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="terminal">
    <h2>[ SYSTEM EMERGENCY: OXYGEN SUPPLY ]</h2>
    <p>Sistem pendingin bocor! Masukkan rumus molekul **Gas Murni Oksigen** untuk mengaktifkan filter udara emergency.</p>
    
    <div>
      <input type="text" id="answerInput" placeholder="Ketik rumus kimia (misal: H2O)...">
      <button onclick="checkAnswer()">INJECT</button>
    </div>

    <div id="feedback" class="status">Status: Menunggu input...</div>
  </div>

  <script>
    function checkAnswer() {
      const answer = document.getElementById("answerInput").value.trim().toUpperCase();
      const feedback = document.getElementById("feedback");

      if (answer === "O2") {
        feedback.style.color = "#00ff66";
        feedback.innerHTML = "✅ AKSES DITERIMA! Udara bersih berhasil dialirkan. Level 1 Selesai!";
      } else {
        feedback.style.color = "#ff4d4d";
        feedback.innerHTML = "❌ AKSES DITOLAK! Senyawa tidak stabil. Coba lagi!";
      }
    }
  </script>

</body>
</html>
